[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Quill"
description = "AI powered git commit assistant"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "GitPython>=3.1",
    "pydantic>=2",
    "langchain>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-ollama>=1.0",
    "ollama>=0.5",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[project.scripts]
quill = "quill.main:app"

[tool.setuptools.packages.find]
include = ["quill*"]
exclude = ["assets*", "tests*"]
