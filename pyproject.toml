[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Quill"
version = "0.1.0"
description = "AI powered git commit assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "GitPython>=3.2.1",
    "google-genai>=2.33.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint>=4.3.1",
    "langgraph-prebuilt>=1.1.1",
    "langsmith>=0.14.16",
    "ollama>=0.6.3",
    "openai>=3.42.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
    "websockets>=17.3",
    "click>=8.5.0",
    "google-api-core>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "black>=24",
    "pytest>=9.2.0",
    "ruff>=0.6",
]

[project.scripts]
quill = "quill.main:app"

[tool.setuptools.packages.find]
include = ["quill*"]
exclude = ["assets*", "tests*"]