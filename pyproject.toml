[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Quill"
description = "AI powered git commit assistant"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "GitPython>=3.1",
    "pydantic>=2",
    "google-genai>=1.0",
    "ollama>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[project.scripts]
quill = "quill.main:app"
